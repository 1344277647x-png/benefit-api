name: Publish Benefit API image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: benefit-api-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/1344277647x-png/benefit-api

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test backend
        run: go test ./controller ./model ./router ./setting/... -count=1

      - name: Check Go formatting
        run: |
          test -z "$(gofmt -l controller/misc.go controller/misc_docs_test.go model/option.go router/api-router.go)"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Check default frontend
        working-directory: web/default
        run: |
          bun run typecheck
          ../node_modules/.bin/oxlint -c .oxlintrc.json \
            src/features/docs \
            src/routes/docs \
            src/features/system-settings/site/documentation-section.tsx \
            src/features/system-settings/site/index.tsx \
            src/features/system-settings/site/section-registry.tsx \
            src/features/system-settings/types.ts \
            src/hooks/use-top-nav-links.ts \
            src/features/home/components/sections/hero.tsx
          ../node_modules/.bin/oxfmt -c .oxfmtrc.json --check \
            src/features/docs \
            src/routes/docs \
            src/features/system-settings/site/documentation-section.tsx \
            src/features/system-settings/site/index.tsx \
            src/features/system-settings/site/section-registry.tsx \
            src/features/system-settings/types.ts \
            src/hooks/use-top-nav-links.ts \
            src/features/home/components/sections/hero.tsx \
            src/i18n/locales/*.json
          bun run build

  build:
    name: Build and publish AMD64 image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Benefit API
            org.opencontainers.image.description=Benefit API customized New API deployment
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Smoke test published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "${IMAGE_NAME}@${IMAGE_DIGEST}"
          CONTAINER_ID=$(docker run -d --rm -p 3000:3000 "${IMAGE_NAME}@${IMAGE_DIGEST}")
          trap 'docker logs "$CONTAINER_ID"; docker stop "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/status | grep -q '"success":true'; then
              exit 0
            fi
            sleep 2
          done

          echo "Published image did not become healthy in time" >&2
          exit 1

      - name: Publish summary
        run: |
          echo "### Benefit API image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
