name: Publish Benefit API image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: benefit-api-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/1344277647x-png/benefit-api

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
