        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test backend
        run: go test ./common ./controller ./model ./router ./service ./setting/... -count=1

      - name: Check Go formatting
        run: |
          formatted_files=(
            common/creation_endpoint_test.go
            common/endpoint_defaults.go
            common/endpoint_type.go
            common/model.go
            constant/endpoint_type.go
            controller/channel-test.go
            controller/channel_health.go
            controller/creation.go
            controller/creation_relay.go
            controller/creation_worker.go
            controller/misc.go
            controller/misc_docs_test.go
            controller/option.go
            controller/referral.go
            controller/referral_test.go
            controller/relay.go
            controller/topup.go
            controller/user.go
            dto/creation.go
            dto/video.go
            main.go
            middleware/creation.go
            model/channel_health.go
            model/channel_health_test.go
            model/generation.go
            model/main.go
            model/option.go
            model/referral.go
            model/referral_test.go
            model/task_cas_test.go
            model/topup.go
            model/user.go
            model/user_update_test.go
            model/user_usage.go
            pkg/perf_metrics/metrics.go
            relay/common/relay_info.go
            router/api-router.go
            router/api_router_email_bind_test.go
            router/channel-router.go
            router/relay-router.go
            service/channel_affinity_usage_cache_test.go
            service/channel_health.go
            service/channel_health_test.go
            service/generation_asset.go
            service/generation_asset_test.go
            service/task_billing_test.go
            setting/channel_health_setting/config.go
            setting/creation_setting/config.go
            setting/operation_setting/referral_setting.go
          )
          test -z "$(gofmt -l "${formatted_files[@]}")"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Check default frontend
        working-directory: web/default
        run: |
          bun run typecheck
          ../node_modules/.bin/oxlint -c .oxlintrc.json \
            src/features/docs \
            src/routes/docs \
            src/features/system-settings/site/documentation-section.tsx \
            src/features/system-settings/site/index.tsx \
            src/features/system-settings/site/section-registry.tsx \
            src/features/system-settings/types.ts \
            src/hooks/use-top-nav-links.ts \
            src/features/home/components/sections/hero.tsx \
            src/features/home/components/sections/stats.tsx \
            src/features/home/components/sections/features.tsx \
            src/features/home/components/sections/cta.tsx \
            src/features/home/components/sections/how-it-works.tsx \
            src/features/home/components/sections/product-preview.tsx \
            src/features/home/components/hero-terminal-demo.tsx \
            src/features/home/components/hero-3d-scene.tsx \
            src/features/home/components/index.ts \
            src/features/home/index.tsx \
            src/components/layout/components/public-header.tsx \
            src/components/ui/button.tsx \
            src/components/ui/command.tsx \
            src/components/ui/dialog.tsx \
            src/components/ui/dropdown-menu.tsx \
            src/components/ui/popover.tsx \
