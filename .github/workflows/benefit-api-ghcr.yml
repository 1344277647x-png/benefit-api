            src/features/auth/auth-layout.tsx \
            src/features/auth/forgot-password/components/forgot-password-form.tsx \
            src/features/auth/forgot-password/index.tsx \
            src/features/auth/sign-in/components/user-auth-form.tsx \
            src/features/auth/sign-in/index.tsx \
            src/features/auth/sign-up/components/sign-up-form.tsx \
            src/features/auth/sign-up/index.tsx \
            src/features/profile/components/dialogs/email-bind-dialog.tsx \
            src/features/profile/components/passkey-card.tsx \
            src/features/profile/components/tabs/account-bindings-tab.tsx \
            src/features/profile/components/two-fa-card.tsx \
            src/features/profile/components/sidebar-modules-card.tsx \
            src/features/referrals \
            src/routes/_authenticated/referrals \
            src/context/theme-provider.tsx \
            src/features/channel-health \
            src/features/channels/api.ts \
            src/features/channels/index.tsx \
            src/features/creation \
            src/features/system-settings/api.ts \
            src/features/system-settings/billing/index.tsx \
            src/features/system-settings/billing/section-registry.tsx \
            src/features/system-settings/billing/referral-settings-section.tsx \
            src/features/system-settings/hooks/use-update-option.ts \
            src/features/system-settings/maintenance/config.ts \
            src/features/system-settings/maintenance/sidebar-modules-section.tsx \
            src/features/system-settings/operations/ai-operations-settings-section.tsx \
            src/features/system-settings/operations/index.tsx \
            src/features/system-settings/operations/section-registry.tsx \
            src/features/users/api.ts \
            src/features/users/components/users-columns.tsx \
            src/features/users/components/users-table.tsx \
            src/features/users/types.ts \
            src/features/wallet/index.tsx \
            src/hooks/use-sidebar-config.ts \
            src/hooks/use-sidebar-data.ts \
            src/routes/_authenticated/creation \
            src/routes/status \
            src/routeTree.gen.ts \
            src/styles/index.css \
            src/i18n/locales/*.json
          bun run build

  build:
    name: Build and publish AMD64 image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Benefit API
            org.opencontainers.image.description=Benefit API customized New API deployment
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Smoke test published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "${IMAGE_NAME}@${IMAGE_DIGEST}"
          CONTAINER_ID=$(docker run -d --rm -p 3000:3000 "${IMAGE_NAME}@${IMAGE_DIGEST}")
          trap 'docker logs "$CONTAINER_ID"; docker stop "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/status | grep -q '"success":true'; then
              exit 0
            fi
            sleep 2
          done

          echo "Published image did not become healthy in time" >&2
          exit 1

      - name: Publish summary
        run: |
          echo "### Benefit API image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
