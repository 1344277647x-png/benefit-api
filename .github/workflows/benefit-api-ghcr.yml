            src/features/system-settings/billing/referral-settings-section.tsx \
            src/features/system-settings/hooks/use-update-option.ts \
            src/features/system-settings/maintenance/config.ts \
            src/features/system-settings/maintenance/sidebar-modules-section.tsx \
            src/features/system-settings/operations/ai-operations-settings-section.tsx \
            src/features/system-settings/operations/index.tsx \
            src/features/system-settings/operations/section-registry.tsx \
            src/features/users/api.ts \
            src/features/users/components/users-columns.tsx \
            src/features/users/components/users-table.tsx \
            src/features/users/types.ts \
            src/features/wallet/index.tsx \
            src/hooks/use-sidebar-config.ts \
            src/hooks/use-sidebar-data.ts \
            src/routes/_authenticated/creation \
            src/routes/status \
            src/routeTree.gen.ts
          ../node_modules/.bin/oxfmt -c .oxfmtrc.json --check \
            src/features/docs \
            src/routes/docs \
            src/features/system-settings/site/documentation-section.tsx \
            src/features/system-settings/site/index.tsx \
            src/features/system-settings/site/section-registry.tsx \
            src/features/system-settings/types.ts \
            src/hooks/use-top-nav-links.ts \
            src/features/home/components/sections/hero.tsx \
            src/features/home/components/sections/stats.tsx \
            src/features/home/components/sections/features.tsx \
            src/features/home/components/sections/cta.tsx \
            src/features/home/components/sections/how-it-works.tsx \
            src/features/home/components/sections/product-preview.tsx \
            src/features/home/components/hero-terminal-demo.tsx \
            src/features/home/components/hero-3d-scene.tsx \
            src/features/home/components/index.ts \
            src/features/home/index.tsx \
            src/components/layout/components/public-header.tsx \
            src/components/ui/button.tsx \
            src/components/ui/command.tsx \
